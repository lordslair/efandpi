# Copy to secret.yaml (don't commit it), fill in values, then: kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  namespace: efandpi
  name: efandpi-backend
type: Opaque
stringData:
  SECRET_KEY: "change-me"
  ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
  DATABASE_URL: "sqlite+aiosqlite:////data/efandpi.db"
  S3_ENDPOINT_URL: ""
  S3_BUCKET: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_REGION: ""
