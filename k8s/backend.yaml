apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: efandpi
  name: efandpi-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: efandpi
  name: efandpi-backend
  labels:
    app: efandpi-backend
spec:
  # SQLite on a RWO volume: single replica, and stop the old pod before starting the new one
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: efandpi-backend
  template:
    metadata:
      labels:
        app: efandpi-backend
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: lordslair/efandpi-backend:edge
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: efandpi-backend
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: efandpi-data
---
# Named "backend" because frontend/nginx.conf proxies /api/ to http://backend:5000
apiVersion: v1
kind: Service
metadata:
  namespace: efandpi
  name: backend
spec:
  selector:
    app: efandpi-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
