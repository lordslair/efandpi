# Reusable flake8 job for backend/: fails on Python syntax errors and undefined names.
# Never runs on its own, only called by the pipeline-* workflows.

name: Lint (backend)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        working-directory: backend

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    # CI runs the same Python as the image: the version comes from the Dockerfile only
    - name: Read Python version 🔍
      id: python
      run: |
        version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -1)
        if [ -z "$version" ]; then
          echo "::error::No 'FROM python:X.Y' found in backend/Dockerfile"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Python ${{ steps.python.outputs.version }} 🐍
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.python.outputs.version }}
        cache: pip
        cache-dependency-path: backend/requirements-lint.txt

    - name: Install requirements ⏬
      run: pip install -r requirements-lint.txt

    - name: Lint with flake8 📝
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
