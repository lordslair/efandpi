# Lint + tests + image builds (backend, frontend) on every push / PR to main.
# Only pushes to main publish the images (tags: edge, short SHA).
# workflow_dispatch runs a dry run (no push) on any branch.

name: Pipeline Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# PRs and dry runs: a new run cancels the previous one.
# main pushes: queued, never cancelled, so an older run can never push edge after a newer one.
# event_name is in the group so a dry run on main never replaces a queued main push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  lint-backend:
    uses: ./.github/workflows/lint-backend.yml

  tests-backend:
    uses: ./.github/workflows/tests-backend.yml

  lint-frontend:
    uses: ./.github/workflows/lint-frontend.yml

  tests-frontend:
    uses: ./.github/workflows/tests-frontend.yml

  build-push:
    runs-on: ubuntu-24.04
    # Multi-arch build through QEMU (arm64 is emulated): about 5 min uncached, above the 10 min default
    timeout-minutes: 15

    needs:
    - lint-backend
    - tests-backend
    - lint-frontend
    - tests-frontend

    strategy:
      # One app failing must not cancel the other: each image is pushed or not on its own result
      fail-fast: false
      matrix:
        app: [ backend, frontend ]

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    # Only pushes publish: PRs (incl. Dependabot/forks) have no Docker Hub secret
    - name: Log in to Docker Hub 🔐
      if: github.event_name == 'push'
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extracting Metadata 🔧
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKER_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.app }}
        tags: |
          type=sha,prefix=,suffix=,format=short
          type=edge

    # Images run on amd64 and arm64 hosts; arm64 is built through QEMU (emulated)
    - name: Set up QEMU 🔧
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx 🐳
      uses: docker/setup-buildx-action@v4

    # cache-to on every run keeps main's cache warm for the next builds and releases.
    # One scope per app, otherwise backend and frontend overwrite each other's cache.
    - name: Build 🏗️ & Push to Docker Hub 🚀
      uses: docker/build-push-action@v7
      with:
        context: ./${{ matrix.app }}
        file: ./${{ matrix.app }}/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # For the app to show what it runs (e.g. 1.2.3 or edge, and the commit SHA)
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          COMMIT=${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.app }}
        cache-to: type=gha,scope=${{ matrix.app }},mode=max
